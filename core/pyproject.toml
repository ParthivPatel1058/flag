[project]
name = "plag-core"
version = "0.1.0"
description = "PLAG core: agent, tools, policy and local API for the PLAG desktop assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psutil>=6.0",
    "keyring>=25.0",
    "pywinauto>=0.6.9",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.6",
    "kokoro-onnx>=0.6.1",
    "nvidia-riva-client>=2.19",  # NVIDIA's voice (Magpie) and hearing (Parakeet), over gRPC
    "edge-tts>=7",  # Microsoft Edge's free voices (what openai-edge-tts is built on)
]

[project.scripts]
plag-core = "plag_core.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plag_core"]
